<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src https: data:; base-uri 'none'; form-action 'none'">
  <title>Shared links</title>
  <style>
    :root { color-scheme: light dark; --bg:#f7f5f2; --fg:#1c1a18; --muted:#655f58; --line:#dcd8d1; --accent:#c0301a; --card:#fffefd; }
    @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#f2f0ed; --muted:#a8a5a0; --line:#353535; --accent:#ff6b4f; --card:#1a1a1a; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
    main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 16px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
    input[type=search] { flex: 1 1 220px; min-height: 38px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: inherit; font: inherit; }
    button { min-height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: inherit; font: inherit; cursor: pointer; }
    button:hover { border-color: var(--muted); }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    li { display: flex; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
    li img { width: 120px; height: 80px; object-fit: cover; border-radius: 8px; flex: none; background: var(--line); }
    .t a { color: var(--accent); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
    .t a:hover { text-decoration: underline; }
    .u { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    .g { font-size: 13px; color: var(--muted); }
    .n { font-size: 14px; margin-top: 4px; }
    .err { padding: 24px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); }
    footer { margin-top: 32px; font-size: 12px; color: var(--muted); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">…</h1>
    <p class="sub" id="sub"></p>
    <div class="bar" id="bar" hidden>
      <input type="search" id="q" aria-label="Search">
      <button id="dlBookmarks"></button>
      <button id="dlCsv"></button>
    </div>
    <div id="out"></div>
    <footer id="foot"></footer>
  </main>
  <script src="share.js"></script>
  <script src="export.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
